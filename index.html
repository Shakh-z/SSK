<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK*S | A Sword in A Sheep</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap');
        
        :root {
            --bg-color: #3b3d40; /* Цвет фона взят с обложки */
            --pale-yellow: #f4efd3;
            --pale-white: #e8e8e8;
            --gray-mid: #888888;
            --gray-dark: #25272a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--pale-white);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* Атмосферный градиент на основе обложки */
        .concrete-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 30%, #52555a 0%, #2c2e32 100%);
            z-index: 0;
        }

        .volumetric-smoke {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            background: 
                radial-gradient(circle at 50% 20%, rgba(244, 239, 211, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 30% 70%, rgba(136, 136, 136, 0.08) 0%, transparent 50%);
            filter: blur(90px);
            opacity: 0.8;
            animation: smokeDrift 14s ease-in-out infinite alternate;
        }

        @keyframes smokeDrift {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(-20px, 15px); }
        }

        .container {
            max-width: 580px;
            width: 100%;
            z-index: 1;
            padding: 45px 30px;
            text-align: center;
            background: rgba(35, 37, 40, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 70px rgba(0,0,0,0.6);
        }

        .video-title-font {
            font-family: 'Anton', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 0.95;
        }

        .logo-container {
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
        }

        .logo-container::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 180px; height: 180px;
            background: radial-gradient(circle, rgba(244, 239, 211, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(20px);
        }

        /* Стиль для обложки/логотипа из картинки */
        .cover-img {
            max-width: 200px;
            width: 100%;
            height: auto;
            border-radius: 50%;
            border: 2px solid rgba(244, 239, 211, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .hero-heading {
            font-size: clamp(2.8rem, 8vw, 4rem);
            color: var(--pale-white);
            margin-top: 15px;
            margin-bottom: 5px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .hero-subheading {
            font-size: clamp(1.2rem, 3.5vw, 1.6rem);
            color: var(--pale-yellow);
            margin-bottom: 25px;
            letter-spacing: 3px;
        }

        p {
            line-height: 1.7;
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: var(--pale-white);
            opacity: 0.85;
        }

        /* Рамочка для даты релиза */
        .release-box {
            display: inline-block;
            border: 1px solid var(--pale-yellow);
            padding: 10px 25px;
            border-radius: 6px;
            margin: 15px 0 25px 0;
            background: rgba(0,0,0,0.2);
        }

        .date {
            color: var(--pale-yellow);
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 1.1rem;
            font-family: 'Anton', sans-serif;
        }

        .event-box {
            background: var(--gray-dark);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tg-button {
            display: inline-block;
            margin-top: 10px;
            padding: 16px 35px;
            background: var(--pale-white);
            color: var(--bg-color);
            text-decoration: none;
            font-family: 'Anton', sans-serif;
            letter-spacing: 2px;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            width: 100%;
            max-width: 300px;
        }

        .tg-button:hover {
            background: var(--pale-yellow);
            box-shadow: 0 0 20px rgba(244, 239, 211, 0.3);
            transform: translateY(-2px);
        }

        footer {
            margin-top: 35px;
            font-size: 0.7rem;
            color: var(--gray-mid);
            text-transform: uppercase;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>
    <div class="concrete-bg"></div>
    <div class="volumetric-smoke"></div>

    <div class="container">
        <!-- Вставляем обложку-логотип из предоставленного файла -->
        <div class="logo-container">
            <img src="IMG_7743.jpeg" alt="A Sword in A Sheep Cover" class="cover-img">
        </div>
        
        <!-- Заголовки новой коллекции -->
        <h1 class="hero-heading video-title-font">SK*S</h1>
        <h2 class="hero-subheading video-title-font">A Sword in A Sheep</h2>
        
        <p>Новая глава лейбла. Концептуальная коллекция, вдохновленная глубиной символизма, чистыми силуэтами и бескомпромиссным качеством.</p>
        
        <!-- Рамочка с датой релиза -->
        <div class="release-box">
            <span class="date">РЕЛИЗ: 25.09.26</span>
        </div>
        
        <div class="event-box">
            <p style="margin-bottom: 0;">Лимитированный дроп будет доступен эксклюзивное время для участников сообщества.</p>
        </div>

        <a href="https://t.me/skyline_fm" class="tg-button">Перейти к релизу</a>
        
        <footer>
            @SKYLINEFM • OFFICIAL LABEL
        </footer>
    </div>
</body>
</html>
