<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK*S | Official Label</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap');
        
        :root {
            --bg-color: #030305;
            --accent-gold: #f7d547;
            --text-main: #d1d1d1;
            --card-bg: rgba(15, 15, 20, 0.7);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* Анимированный "дым" */
        .smoke {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 30% 20%, rgba(247, 213, 71, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(100, 50, 200, 0.05) 0%, transparent 50%);
            filter: blur(100px);
            animation: drift 20s infinite alternate;
        }

        /* "Звездная пыль" */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.1;
            pointer-events: none;
        }

        @keyframes drift {
            0% { transform: scale(1) translateY(0); }
            100% { transform: scale(1.2) translateY(-20px); }
        }

        .container {
            max-width: 600px;
            width: 100%;
            z-index: 1;
            padding: 50px 30px;
            text-align: center;
            background: rgba(10, 10, 12, 0.5);
            backdrop-filter: blur(25px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { font-family: 'Cinzel', serif; font-size: clamp(3rem, 10vw, 4rem); color: #fff; letter-spacing: 12px; margin-bottom: 5px; text-transform: uppercase; }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
        }
        .time-block { font-size: 0.8rem; letter-spacing: 2px; color: var(--accent-gold); }
        .time-val { display: block; font-size: 1.5rem; font-weight: 700; color: #fff; }

        .tg-button {
            display: inline-block;
            margin-top: 20px;
            padding: 18px 40px;
            background: #fff;
            color: #000;
            text-decoration: none;
            font-weight: 700;
            border-radius: 50px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.9rem;
            width: 100%;
            max-width: 320px;
        }
        .tg-button:hover { background: var(--accent-gold); transform: translateY(-3px); }
    </style>
</head>
<body>
    <div class="smoke"></div>
    <div class="stars"></div>
    <div class="container">
        <h1>SK*S</h1>
        <div class="countdown" id="timer">
            <div class="time-block"><span class="time-val" id="days">0</span>Дней</div>
            <div class="time-block"><span class="time-val" id="hours">0</span>Часов</div>
            <div class="time-block"><span class="time-val" id="mins">0</span>Мин</div>
        </div>
        <p>Первый эксклюзивный дроп состоится в честь третьей годовщины семьи.</p>
        <a href="https://t.me/skyline_fm" class="tg-button" onclick="playClick()">Перейти на пост</a>
    </div>

    <script>
        // Таймер
        function updateTimer() {
            const target = new Date('2026-10-12T00:00:00');
            const now = new Date();
            const diff = target - now;
            
            document.getElementById('days').innerText = Math.floor(diff / (1000*60*60*24));
            document.getElementById('hours').innerText = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
            document.getElementById('mins').innerText = Math.floor((diff % (1000*60*60)) / (1000*60));
        }
        setInterval(updateTimer, 60000);
        updateTimer();

        // Легкий аудио-клик (синтезированный звук)
        function playClick() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 880;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }
    </script>
</body>
</html>
