<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK*S — Family Anniversary Merch</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            letter-spacing: 2px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
            margin: auto;
        }

        .authors-tag {
            font-size: 10px;
            letter-spacing: 4px;
            color: #666666;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 200;
            letter-spacing: 8px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: #aaaaaa;
            text-transform: uppercase;
            margin-bottom: 50px;
        }

        .description {
            font-size: 1rem;
            line-height: 1.8;
            color: #888888;
            margin-bottom: 60px;
            letter-spacing: 3px;
        }

        .cta-container {
            margin-bottom: 60px;
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            transition: all 0.4s ease;
        }

        .btn:hover {
            background: #ffffff;
            color: #0b0b0b;
        }

        footer {
            font-size: 10px;
            letter-spacing: 4px;
            color: #555555;
            text-transform: uppercase;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
                letter-spacing: 4px;
            }
            .description {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="authors-tag">[authors reserved]</div>
        
        <h1>SK*S Merch</h1>
        <div class="subtitle">Family Anniversary Giveaway</div>
        
        <div class="description">
            —
        </div>

        <div class="cta-container">
            <a href="#" class="btn">Участвовать в розыгрыше</a>
        </div>
    </div>

    <footer>
        @SKYLINEFM
    </footer>

</body>
</html>
